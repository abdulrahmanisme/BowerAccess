[build]
command = "bun run build"
publish = "dist/client"
functions = "netlify/functions"

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "VITE_POSTHOG_HOST,VITE_SUPABASE_PROJECT_ID"

# Route all requests to the SSR function (except static assets)
[[redirects]]
from = "/*"
to = "/.netlify/functions/ssr"
status = 200
force = true
